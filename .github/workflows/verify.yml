name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows is what the harness targets first: the image already ships Chrome,
    # which scripts/lib/harness.mjs finds at its default install path.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, offline guarantees, e2e
        run: npm run verify

      - name: Keep failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            .output/e2e-*.png
            .output/e2e-result.md
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
