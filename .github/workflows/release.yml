name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Typecheck, build, offline guarantees, e2e
        run: npm run verify

      - name: Package
        run: npm run zip

      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem .output -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'No zip was produced' }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -FilePath .output/SHA256SUMS.txt -Encoding ascii
          Get-Content .output/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
            .output/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
